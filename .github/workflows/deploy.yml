name: Deploy to EC2

# Manual only, on purpose - this is a one-time/on-demand deploy, not
# continuous deployment. Triggering it is a deliberate action from the
# Actions tab ("Run workflow"), not something every push to main does.
# See DEPLOY.md for the one-time setup this depends on (the EC2 instance
# itself, and the three repo secrets referenced below).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code and redeploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/work-management-platform
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml exec -T backend npm run migrate
            docker image prune -f
