server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # This is a client-side-routed SPA (React Router) - a direct request or
  # refresh on e.g. /tasks/abc123 is a request nginx knows nothing about, so
  # it has to fall back to index.html and let React Router take over rather
  # than 404ing on every route except "/".
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
